[project]
name = "nsc-seatlocator"
version = "0.2.0"
description = "SmartClass seat locator: image URL + classroom_id -> (row, col) + user_id, integrated with face-backend and teamusers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "asyncpg>=0.29",
    "teamusers-sdk>=0.4.0",
]

[project.optional-dependencies]
# detector 需要真实推理时安装：uv pip install -e ".[detector]"
detector = [
    "ultralytics>=8.3.200",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
